<p>Many Korean words are built from Sino-Korean syllables that keep the same meaning wherever they appear. Each root (like <b>국</b> “country”) has a table of words that use it, and every word is broken down syllable by syllable.</p>
<h4>Browsing</h4>
<ul><li>Pick a root from the list on the side (on a phone, tap the <b>arrow</b> next to the title to show or hide the list).</li>
<li>Choose <b>All words</b> at the top of that list to see the whole shared word list and which tables show each word. A crossed-out table means the word was removed from it. Use the filters at the top to narrow the list by text, by table, or by status (learned, not learned, or unassigned, meaning not shown in any root’s table).</li>
<li><b>Click any syllable</b> in a word to jump to that syllable’s own root table. Use <b>← Back</b> to return.</li>
<li>If a syllable has no table yet, you’ll be asked whether to create one.</li></ul>
<h4>Pronunciation</h4>
<ul><li>Tap the <b>speaker</b> button next to a word (or next to the root’s title) to hear it read aloud. The sound comes from your device’s Korean voice. If it sounds poor, open <b>Settings</b> (the gear icon) to choose a better voice or change the speed. Settings also lets you switch between light and dark themes.</li></ul>
<h4>Searching</h4>
<ul><li>Use the search box under the title to find a word, root, meaning, hanja, or romanization (for example “hakgyo” finds 학교) across all roots. Click a result to jump to it (use ↑ ↓ and Enter on a keyboard).</li></ul>
<h4>Adding and editing</h4>
<ul><li>All words live in one shared list. Each table shows every word that contains that root’s syllable, so editing a word changes it everywhere. <b>Remove from table</b> (in a word’s edit dialog) only hides it from the current table; add the same word again there to bring it back.</li><li><b>+ Add word</b>: type the Korean word. A row appears for each syllable where you can set a meaning (optional; it defaults to the root’s meaning) and, when a syllable has several roots, pick which one it belongs to.</li>

<h4>Marking what you’ve learned</h4>
<ul><li>Tap the small <b>circle</b> at the left of a word’s row to mark that word as learned. It fills in with a ✓. Tap it again to unmark.</li>
<li>At the top of a root’s table, tap the <b>circle</b> to the left of the root’s title. A syllable’s root is one click away: click the syllable, then mark it there.</li>
<li>Learned items are shown <span class="kn">highlighted</span>.</li>
</ul>
<h4>Saving and moving your data</h4>
<ul><li>Changes are saved automatically, but <b>only in this browser</b> on this device.</li>
<li><b>Export</b> (document with an arrow leaving it) downloads a backup file named KRoots.date.json. The header reminds you when you have unexported changes.</li>
<li><b>Import</b> (document with an arrow entering it) loads such a file, either from your device or from a URL, and <b>replaces</b> what’s currently here. Use Export then Import to move your words to another browser or device.</li></ul>`,[{label:'Close'}]);

try{Object.assign(vp,JSON.parse(localStorage.getItem(VK)||'{}'))}catch(e){}
const saveVp=()=>{try{localStorage.setItem(VK,JSON.stringify(vp))}catch(e){}};
const koVoices=()=>('speechSynthesis' in window?speechSynthesis.getVoices():[]).filter(x=>/^ko([-_]|$)/i.test(x.lang));
function vScore(x){const n=x.name.toLowerCase();let c=0;
  if(/natural|neural|online|multilingual/.test(n))c+=6;
  if(/premium|enhanced|siri/.test(n))c+=5;
  if(/google/.test(n))c+=4;
  if(/sunhi|injoon|hyunsu|yuna|sora/.test(n))c+=3;
  if(/heami/.test(n))c-=2;
  if(x.localService===false)c+=1;return c}
function pickVoice(){const l=koVoices();if(!l.length)return null;
  const mine=vp.v&&l.find(x=>x.name===vp.v);if(mine)return mine;
  return l.slice().sort((a,b)=>vScore(b)-vScore(a))[0]}
let warned=false;
function say(t,btn,force){
  if(!('speechSynthesis' in window)){note('No speech support','This browser can’t read words aloud. Try a different browser, such as Chrome, Edge or Safari.');return}
  const ss=speechSynthesis;ss.cancel();
  const vs=ss.getVoices(),v=pickVoice();
  if(vs.length&&!v&&!warned){warned=true;note('No Korean voice found','This device has no Korean voice installed, so pronunciation may be silent or wrong. Add one in your system’s speech or language settings.')}
  const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(v)u.voice=v;u.rate=vp.r||1;
  if(btn){btn.classList.add('on');const off=()=>btn.classList.remove('on');u.onend=off;u.onerror=off}
  ss.speak(u)}
const speak=say;
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',()=>{})}
function voiceSettings(){
  const l=koVoices().slice().sort((a,b)=>vScore(b)-vScore(a)),auto=pickVoice();
  const opts='<option value="">Automatic (best available'+(auto&&!vp.v?': '+esc(auto.name):'')+')</option>'+l.map(x=>`<option value="${esc(x.name)}"${x.name===vp.v?' selected':''}>${esc(x.name)}${x.localService===false?' (online)':''}</option>`).join('');
  const d=modal('Settings','<label>Theme<select id="thsel">'+[['system','Match device'],['light','Light'],['dark','Dark']].map(([k,n])=>`<option value="${k}"${k===theme?' selected':''}>${n}</option>`).join('')+'</select></label>'+(l.length?`<label>Voice<select id="vsel">${opts}</select></label><label>Pronunciation speed: <span id="vrv">${(vp.r||1).toFixed(2)}</span>×<input id="vr" type="range" min="0.5" max="1.3" step="0.05" value="${vp.r||1}"></label><p class="sub">Voices named “Natural”, “Neural”, “Google”, or “Premium/Enhanced” usually sound best. More voices can be installed in your device’s speech or language settings.</p>`:'<p>No Korean voices were found on this device. Install one in your system’s speech or language settings, then reload this page.</p>'),
  [{label:'Test',fn:d=>{if(l.length){const sl=d.querySelector('#vsel');vp.v=sl.value;vp.r=+d.querySelector('#vr').value;say('한국, 중국, 미국')}return false}},{label:'Done',fn:d=>{if(l.length){vp.v=d.querySelector('#vsel').value;vp.r=+d.querySelector('#vr').value;saveVp()}}}]);
  d.querySelector('#thsel').onchange=e=>setTheme(e.target.value);
  const r=d.querySelector('#vr');if(r)r.oninput=()=>d.querySelector('#vrv').textContent=(+r.value).toFixed(2)}
// search
const q=$('#q'),sr=$('#sr');
const nz=x=>String(x??'').toLowerCase();
// Revised Romanization, syllable by syllable (no sound-change rules), used for search
const RI=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
const RV=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
const RF=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
const roman=x=>[...String(x??'')].map(c=>{const n=c.charCodeAt(0)-0xAC00;if(n<0||n>11171)return c.toLowerCase();const f=n%28,v=Math.floor(n/28)%21,i=Math.floor(n/588);return RI[i]+RV[v]+RF[f]}).join('');
// Fold look-alike letters so "kuk", "guk" and "gug" all match (g/k, d/t, b/p, l/r, ch/j)
const loose=x=>x.toLowerCase().replace(/[\s'’.\-]/g,'').replace(/ch/g,'j').replace(/[gdbl]/g,c=>({g:'k',d:'t',b:'p',l:'r'}[c]));
function search(t){t=nz(t).trim();if(!t)return[];const out=[];
  const lat=/^[a-z][a-z\s'’\-]*$/.test(t),q2=lat?loose(t):'';
  const rmatch=x=>{if(!lat)return 0;const r=loose(roman(x));return r.startsWith(q2)?2:r.includes(q2)?1:0};
  db.roots.forEach((r,i)=>{
    const rh=nz([rk(r),r.m,r.h].join(' ')),rm=rmatch(r.c);
    if(rh.includes(t)||rm)out.push({k:'root',i,sc:nz(rk(r)).startsWith(t)||nz(r.m).startsWith(t)||rm==2?0:1})});
  db.words.forEach((w,j)=>{const i=db.roots.findIndex(r=>shown(w,r));if(i<0)return;
    const hs=nz([w.w,w.m,w.l,...w.s.map(s=>s.g)].join(' ')),rm=rmatch(w.w);
    if(hs.includes(t)||rm)out.push({k:'word',i,j,sc:nz(w.w).startsWith(t)||nz(w.m).startsWith(t)||rm==2?0:2})});
  return out.sort((a,b)=>a.sc-b.sc).slice(0,40)}
let sres=[],sel=-1;
function hideSr(){sr.style.display='none';sel=-1}
function runSearch(){const t=q.value;if(!t.trim()){hideSr();return}
  sres=search(t);sel=-1;
  sr.innerHTML=sres.length?sres.map((x,n)=>{const r=db.roots[x.i];
    if(x.k=='root')return `<button class="sri" data-n="${n}"><b>${esc(rk(r))}</b><small>${esc(roman(r.c))}</small><small>${esc(r.m)}${r.h?` (${esc(r.h)})`:''}</small><span class="tg">root</span></button>`;
    const w=db.words[x.j];
    return `<button class="sri" data-n="${n}"><b>${esc(w.w)}</b><small>${esc(roman(w.w))}</small><small>${esc(w.m)}</small><span class="tg">in ${esc(rk(r))}</span></button>`}).join(''):'<div class="sre">No matches</div>';
  sr.style.display='block'}
function pick(n){const x=sres[n];if(!x)return;
  hideSr();q.value='';q.blur();master=false;hist=[];cur=x.i;render();scrollTo(0,0);
  if(x.k=='word'){const wv=db.words[x.j].w,tr=[...$('#main tbody').children].find(e=>e.firstElementChild.dataset.w===wv);if(tr){tr.classList.add('hit');tr.scrollIntoView({block:'center'})}}}
q.addEventListener('input',runSearch);
q.addEventListener('focus',()=>{if(q.value.trim())runSearch()});
q.addEventListener('keydown',e=>{
  if(e.key=='Escape'){hideSr();q.blur();return}
  const items=[...sr.querySelectorAll('.sri')];if(!items.length)return;
  if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();sel=(sel+(e.key=='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((b,k)=>b.classList.toggle('on',k==sel));items[sel].scrollIntoView({block:'nearest'})}
  else if(e.key=='Enter'){e.preventDefault();pick(sel>=0?sel:0)}});
sr.addEventListener('mousedown',e=>e.preventDefault());
sr.addEventListener('click',e=>{const b=e.target.closest('.sri');if(b)pick(+b.dataset.n)});
document.addEventListener('click',e=>{if(!e.target.closest('#sw'))hideSr()});
// export / import
let fh=null;
const fnEl={value:'KRoots.'+new Date().toLocaleDateString('sv')};const base=n=>n.replace(/\.json$/i,'');
const fname=()=>(base(fnEl.value.trim()).replace(/[\\\/:*?"<>|]/g,'')||'KRoots')+'.json';
const FT=[{description:'JSON',accept:{'application/json':['.json']}}];
function mergeIn(inc){const key=r=>r.c+(r.t||''),have=new Map(db.roots.map(r=>[key(r),r]));let nr=0,nw=0,kw=0;
  for(const r of inc.roots){if(!r||typeof r.c!=='string')continue;const o=have.get(key(r));
    if(!o){const n={c:r.c,t:r.t||'',m:r.m||'',h:r.h||''};db.roots.push(n);have.set(key(n),n);nr++}
    else{if(!o.m&&r.m)o.m=r.m;if(!o.h&&r.h)o.h=r.h}}
  const mine=new Map(db.words.map(w=>[w.w,w]));
  for(const w of inc.words){const o=mine.get(w.w);
    if(!o){db.words.push(w);mine.set(w.w,w);nw++;continue}
    kw++;if(!o.m&&w.m)o.m=w.m;if(!o.l&&w.l)o.l=w.l;
    w.s.forEach((x,i)=>{const y=o.s[i];if(y&&y.c===x.c&&!y.g&&x.g)y.g=x.g})}
  for(const k of ['words','roots'])Object.assign(db.known[k],inc.known[k]);
  return{nr,nw,kw}}
function loadText(t,mode){let d;const T='Can’t import this file';
  try{d=JSON.parse(t)}catch(e){return note(T,'It isn’t valid JSON. Choose a file saved with the Export button.')}
  if(!d||!Array.isArray(d.roots))return note(T,'It has no “roots” list, so it doesn’t look like a KoreanRoots export. Choose a file saved with the Export button.');
  try{if(!d.roots.every(r=>r&&typeof r.c==='string'))throw 0;migrate(d)}catch(e){return note(T,'Some roots or words in it are malformed, so it couldn’t be read. Nothing was changed.')}
  if(mode==='merge'){const r=mergeIn(d);if(cur>=db.roots.length)cur=0;hist=[];changed();render();
    modal('Merge complete',`<p>Added ${r.nr} new root${r.nr==1?'':'s'} and ${r.nw} new word${r.nw==1?'':'s'}. ${r.kw} word${r.kw==1?' was':'s were'} already here and kept as ${r.kw==1?'it is':'they are'}.</p>`,[{label:'Close'}])}
  else{db=d;master=false;mf={q:'',s:'all',t:''};cur=0;hist=[];changed();dirty=false;render()}}
$('#save').onclick=async()=>{const txt=JSON.stringify(db,null,1),name=fname();
  if(window.showSaveFilePicker){try{if(fh&&fh.name!==name)fh=null;if(!fh){fh=await showSaveFilePicker({suggestedName:name,types:FT});fnEl.value=base(fh.name)}
    const w=await fh.createWritable();await w.write(txt);await w.close();dirty=false;status();return}
  catch(e){if(e.name=='AbortError')return;fh=null}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();dirty=false;status()};
let impMode='replace';
const im=d=>d.querySelector('input[name=im]:checked').value;
async function pickFile(mode){impMode=mode;
  if(window.showOpenFilePicker){try{const [h]=await showOpenFilePicker({types:FT});const t=await (await h.getFile()).text();if(mode==='replace'){fh=h;fnEl.value=base(h.name)}loadText(t,mode)}catch(e){}return}
  $('#file').click()}
const rawUrl=u=>{u=u.trim();const m=u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);return m?`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`:u};
$('#load').onclick=()=>{
  const go=d=>{const mode=im(d),u=rawUrl(v(d,'u')),er=d.querySelector('#ue');er.style.color='';
    if(!/^https?:\/\//i.test(u)){er.style.color='var(--no)';er.textContent='Enter a full URL starting with https://';return}
    er.textContent='Loading…';
    fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>{d.close();loadText(t,mode)})
    .catch(e=>{er.style.color='var(--no)';er.textContent="Couldn't load that URL ("+e.message+"). The link must point directly to the JSON file, and the host must allow cross-site access (CORS). GitHub raw links work; many file-sharing links don't."})};
  const d=modal('Import from JSON','<div class="sub" style="margin-top:0;position:relative;display:flex;align-items:center;gap:6px">Import mode <button type="button" class="tgi" aria-label="What do Replace and Merge do?" aria-expanded="false">?</button><div class="tgn" role="tooltip" hidden><b>Replace</b>: use the imported data instead of what is here.<br><b>Merge</b>: add new roots and words from the file, and keep what is here.</div></div><label class="opt" title="Use the imported data instead of what is here"><input type="radio" name="im" value="replace" checked>Replace</label><label class="opt" title="Add new roots and words from the file, and keep what is here"><input type="radio" name="im" value="merge">Merge</label><div class="sub">Source</div><div class="seg" role="group" aria-label="Import source"><button type="button" id="sf" class="on" aria-pressed="true">File</button><button type="button" id="su" aria-pressed="false">URL</button></div><div class="panes"><div class="drop" id="pfile" tabindex="0" role="button">Drop a .json file here or click to browse</div><div class="pane" id="purl" hidden><div class="urow"><input id="u" type="url" placeholder="https://example.com/KRoots.json" autocomplete="off" spellcheck="false" aria-label="JSON file URL"><button type="button" id="lu">Load URL</button></div><div class="sub" id="ue"></div></div></div>',
  [{label:'Cancel'}]);
  d.classList.add('imp');
  {const bt=d.querySelector('.tgi'),nt=d.querySelector('.tgn');let pin=false;const show=x=>{nt.hidden=!x;bt.setAttribute('aria-expanded',x)};
   bt.onmouseenter=()=>show(true);bt.onmouseleave=()=>show(pin);bt.onclick=e=>{e.preventDefault();pin=!pin;show(pin)};
   d.addEventListener('click',e=>{if(!e.target.closest('.tgi')){pin=false;show(false)}})}d.querySelector('#lu').onclick=()=>go(d);
  const pick=k=>{[['sf','file'],['su','url']].forEach(([id,n])=>{const b=d.querySelector('#'+id);b.classList.toggle('on',n===k);b.setAttribute('aria-pressed',n===k)});
    d.querySelector('#pfile').hidden=k!=='file';d.querySelector('#purl').hidden=k!=='url';if(k==='url')d.querySelector('#u').focus()};
  d.querySelector('#sf').onclick=()=>pick('file');d.querySelector('#su').onclick=()=>pick('url');
  const dz=d.querySelector('#pfile'),choose=()=>{pickFile(im(d));d.close()};
  dz.onclick=choose;dz.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();choose()}};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');const fl=e.dataTransfer.files[0];if(!fl)return;const mode=im(d);d.close();
    if(mode==='replace'){fh=null;fnEl.value=base(fl.name)}const rd=new FileReader();rd.onload=()=>loadText(rd.result,mode);rd.readAsText(fl)};
  d.querySelector('#u').addEventListener('keydown',e=>{if(e.key=='Enter'){e.preventDefault();go(d)}})};
$('#file').onchange=e=>{const fl=e.target.files[0];if(!fl)return;fh=null;if(impMode==='replace')fnEl.value=base(fl.name);const rd=new FileReader();rd.onload=()=>loadText(rd.result,impMode);rd.readAsText(fl);e.target.value=''};
onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
render();
if(tagFix.length)try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){}
</script>
